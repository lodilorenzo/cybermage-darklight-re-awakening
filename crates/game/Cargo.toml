[package]
name = "cybermage"
version = "1.3.0"
edition = "2021"
license = "GPL-2.0-or-later"

[features]
windows-gui = []

[dependencies]
cpal = "0.18.2"
minifb = "0.29.0"
x86 = { path = "../x86" }

[build-dependencies]
cc = "1.6.0"

[target.'cfg(windows)'.dependencies]
ash = { version = "0.38", default-features = false, features = ["loaded", "std", "debug"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
